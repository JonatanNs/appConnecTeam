spring.application.name=nexTeam

spring.datasource.url=jdbc:postgresql://localhost:5432/nexteam
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.datasource.url=jdbc:mysql://localhost:3306/nexteam
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Active les statistiques Hibernate et affiche les informations détaillées
# concernant les performances et l'utilisation de Hibernate dans les logs.
logging.level.org.hibernate.stat=DEBUG

# Active la génération des statistiques Hibernate :
# nombre de requêtes SQL, temps d'exécution, cache, entités chargées, etc.
spring.jpa.properties.hibernate.generate_statistics=true

# permet à Hibernate de regrouper ces accès en lots, avec WHERE id IN (...), par packet de 20.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

jwt.secret=${JWT_SECRET}
# 15minutes
jwt.expiration=900000