<div class="relative inline-block"
     (mouseenter)="openProfileMenu()"
     (mouseleave)="closeProfileMenu()">

  <!-- Bouton profil amélioré -->
  <button type="button"
          class="relative z-10 flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200/80 rounded-xl
                     hover:bg-gray-50 hover:text-gray-900 focus:outline-none transition-all duration-200 shadow-xs cursor-pointer"
          [attr.aria-expanded]="isProfileMenuOpen()">
    <div class="flex items-center justify-center w-7 h-7 rounded-full bg-nxt-primary/10 text-nxt-primary">
      <fa-icon [icon]="faUser" class="text-xs"></fa-icon>
    </div>
    <fa-icon
      [icon]="faChevronDown"
      class="text-sm text-gray-400 transition-transform duration-200"
      [class.rotate-180]="isProfileMenuOpen()">
    </fa-icon>
  </button>

  @if (isProfileMenuOpen()) {
    <div class="absolute right-0 z-50 w-64 pt-2">
      <!-- Conteneur principal avec ombre portée soignée -->
      <div class="overflow-hidden origin-top-right bg-nxt-surface rounded-2xl shadow-xl border border-gray-200/80 backdrop-blur-md">

        <!-- En-tête du profil (Rappel utilisateur) -->
        <div class="px-4 py-3.5 bg-gray-50/50 border-b border-gray-100 flex items-center space-x-3">
          <div class="flex items-center justify-center w-10 h-10 rounded-full bg-nxt-primary/15 text-nxt-primary font-bold">
            <fa-icon [icon]="faUser" class="text-sm"></fa-icon>
          </div>
          <div class="overflow-hidden">
            <p class="text-sm font-semibold text-gray-900 truncate">Mon compte</p>
            <p class="text-xs text-gray-500 truncate">Utilisateur Nexteam</p>
          </div>
        </div>

        <!-- Liens de navigation -->
        <div class="p-1.5 space-y-0.5">
          <a routerLink="/profil">
            <span>
              <fa-icon [icon]="faUser" class="text-xs"></fa-icon>
            </span>
            Voir mon profil
          </a>

          <a routerLink="/admin">
            <span>
              <fa-icon [icon]="faShieldHalved" class="text-xs"></fa-icon>
            </span>
            Administration
          </a>

          <a routerLink="/parametres">
            <span>
              <fa-icon [icon]="faGear" class="text-xs"></fa-icon>
            </span>
            Paramètres
          </a>

          <div class="my-1 border-t border-gray-100"></div>

          <a routerLink="/aide">
            <span>
              <fa-icon [icon]="faCircleQuestion" class="text-xs"></fa-icon>
            </span>
            Aide & Support
          </a>
        </div>

        <!-- Bouton Déconnexion -->
        <div class="p-1.5 bg-gray-50/50 border-t border-gray-100">
          <button type="button" class="w-full btn-nxt-error text-nxt-surface">
            <span class="flex items-center justify-center w-7 h-7 mr-2 rounded-lg bg-red-100/50 text-red-500">
              <fa-icon [icon]="faRightFromBracket" class="text-xs text-nxt-surface"></fa-icon>
            </span>
            Déconnexion
          </button>
        </div>

      </div>
    </div>
  }
</div>
