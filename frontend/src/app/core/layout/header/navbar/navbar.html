<nav class="flex flex-1 items-center justify-between ml-5">

  <!-- Navigation principale -->
  <div class="flex items-center gap-1">
    <a routerLink="" class="nav-link-nxt">Accueil</a>
    <a class="nav-link-nxt">Messageries</a>
    <a routerLink="/annuaires" class="nav-link-nxt">Annuaires</a>
    <a class="nav-link-nxt">RH</a>
  </div>

  <!-- Actions à droite -->
  <div class="flex items-center gap-3">

    <input
      type="text"
      placeholder="Recherche"
      class="input-nxt w-32 md:w-56" />

    <button class="icon-btn-nxt" aria-label="Notifications">
      <fa-icon [icon]="faBell"></fa-icon>
    </button>

    <button class="icon-btn-nxt" aria-label="Paramètres">
      <fa-icon [icon]="faGear"></fa-icon>
    </button>

    <!-- Dropdown Profil -->
    <div class="relative">
      <button (click)="toggleProfileMenu()" class="icon-btn-nxt" aria-label="Profil">
        <fa-icon [icon]="faUser"></fa-icon>
      </button>

      @if (isProfileMenuOpen()) {
        <ul class="absolute right-0 mt-2 w-52 bg-nxt-white border border-nxt-gray rounded-xl shadow-lg p-2 z-50">
          <li><a routerLink="/admin" class="dropdown-item-nxt">Administration</a></li>
          <li><a class="dropdown-item-nxt">Paramètres</a></li>
          <li><a class="dropdown-item-nxt text-nxt-error">Déconnexion</a></li>
        </ul>
      }
    </div>

  </div>
</nav>
