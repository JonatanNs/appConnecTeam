<!-- Bouton Burger & Menu Déroulant (Mobile uniquement - Aligné à gauche) -->
<div class="relative lg:hidden">
  <button type="button"
          (click)="isMobileMenuOpen = !isMobileMenuOpen"
          class="flex h-10 w-10 items-center justify-center rounded-xl text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none"
          aria-label="Ouvrir le menu">
    <fa-icon [icon]="isMobileMenuOpen ? faXmark : faBars" class="text-xl"></fa-icon>
  </button>

  @if (isMobileMenuOpen) {
    <!-- Backdrop de fermeture -->
    <div class="fixed inset-0 z-40" (click)="isMobileMenuOpen = false"></div>

    <!-- Dropdown Mobile -->
    <div class="absolute top-full left-0 z-50 mt-2 w-64 divide-y divide-gray-100 rounded-2xl border border-gray-100 bg-white p-2 shadow-2xl">

      <!-- Liens de navigation -->
      <div class="flex flex-col gap-0.5 pb-2">
        <a routerLink="/accueil" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faHouse" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Accueil</span>
        </a>
        <a routerLink="/actualites" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faNewspaper" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Actualités</span>
        </a>
        <a routerLink="/messageries" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faComments" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Messageries</span>
        </a>
        <a routerLink="/annuaires" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faAddressBook" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Annuaires</span>
        </a>
        <a routerLink="/rh" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faUsers" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>RH</span>
        </a>
        <a routerLink="/admin" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faShieldHalved" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Administration</span>
        </a>
      </div>

      <!-- Profil & Réglages -->
      <div class="flex flex-col gap-0.5 py-2">
        <a routerLink="/profil" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faUser" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Voir mon profil</span>
        </a>
        <a routerLink="/parametres" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faGear" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Paramètres</span>
        </a>
        <a routerLink="/aide" routerLinkActive="bg-blue-50 text-nxt-primary font-semibold" (click)="isMobileMenuOpen = false" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-50">
          <fa-icon [icon]="faCircleQuestion" class="w-4 text-sm text-gray-400"></fa-icon>
          <span>Aide & Support</span>
        </a>
      </div>

      <!-- Bouton Déconnexion -->
      <div class="pt-2">
        <button type="button"
                (click)="logout(); isMobileMenuOpen = false"
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-red-50 px-3 py-2 text-xs font-semibold text-red-600 transition-colors hover:bg-red-100">
          <fa-icon [icon]="faRightFromBracket" class="text-sm"></fa-icon>
          <span>Déconnexion</span>
        </button>
      </div>

    </div>
  }
</div>

<!-- Navigation principale (Desktop uniquement - Au centre) -->
<nav class="hidden lg:flex items-center gap-1">
  <a routerLink="/accueil" routerLinkActive="bg-gray-100 text-nxt-primary font-semibold" class="link-nxt">Accueil</a>
  <a routerLink="/actualites" routerLinkActive="bg-gray-100 text-nxt-primary font-semibold" class="link-nxt">Actualités</a>
  <a routerLink="/messageries" routerLinkActive="bg-gray-100 text-nxt-primary font-semibold" class="link-nxt">Messageries</a>
  <a routerLink="/annuaires" routerLinkActive="bg-gray-100 text-nxt-primary font-semibold" class="link-nxt">Annuaires</a>
  <a routerLink="/rh" routerLinkActive="bg-gray-100 text-nxt-primary font-semibold" class="link-nxt">RH</a>
  @if (authService.hasRole('ROLE_ADMIN')) {
    <a routerLink="/admin" routerLinkActive="bg-gray-100 text-nxt-primary font-semibold" class="link-nxt">Administration</a>
  }
</nav>

<!-- Actions de droite (Recherche + Notifs + Profil - Toujours à droite) -->
<div class="ml-auto flex items-center gap-2 sm:gap-3">

  <div class="relative hidden lg:block">
    <fa-icon [icon]="faMagnifyingGlass" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-gray-400"></fa-icon>
    <input type="text" placeholder="Rechercher..." class="!w-48 border-gray-200/80 bg-gray-50 py-1.5 pl-9 text-xs focus:bg-white focus:!w-64 transition-all">
  </div>

  <app-user-notif />

  <app-user-profil class="hidden md:block" />

</div>
