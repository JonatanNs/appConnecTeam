<!-- Bouton de retour moderne -->
<div class="mb-6">
  <a routerLink="/admin"
     class="inline-flex items-center gap-2 text-xs font-semibold text-gray-600 hover:text-gray-900 bg-white border border-gray-200/80 px-3 py-2 rounded-xl shadow-xs transition-all duration-200 hover:bg-gray-50">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Retour à l'administration
  </a>
</div>

@if (users(); as response) {

  <!-- En-tête de page moderne et épuré -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8 pb-6 border-b border-gray-200/70">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight mb-1">Gestion des utilisateurs</h1>
      <p class="text-xs text-gray-500">Administrez les comptes et les accès des membres de l'équipe</p>
    </div>

    <a routerLink="ajouter-utilisateur"
       class="inline-flex items-center justify-center gap-2 px-4 py-2.5 text-xs font-semibold text-white bg-nxt-primary hover:bg-nxt-primary/90 rounded-xl shadow-md shadow-nxt-primary/25 transition-all cursor-pointer">
      <fa-icon [icon]="faPlus" class="text-xs"></fa-icon>
      Ajouter un utilisateur
    </a>
  </div>

  <!-- Barre de recherche / filtres intégrée dans un conteneur carte soigné -->
  <div class="mb-6 bg-white border border-gray-200/80 rounded-2xl p-4 shadow-xs">
    <app-search-filter/>
  </div>

  <!-- Pagination du haut -->
  @if (response.data.totalPages > 1) {
    <div class="mb-6">
      <app-paginate
        [totalPages]="response.data.totalPages"
        [number]="response.data.number"
        [first]="response.data.first"
        [last]="response.data.last"
        [pageSize]="response.data.size"
        (pageChange)="goToPage($event)"
        (pageSizeChange)="changePageSize($event)">
      </app-paginate>
    </div>
  }

  <!-- Conteneur principal de la liste sous forme de carte propre -->
  <div class="bg-white border border-gray-200/80 rounded-2xl shadow-xl overflow-hidden backdrop-blur-md mb-6">
    <app-table-list-user [users]="response" (userAction)="onUserAction($event)"/>
  </div>

  <!-- Pagination du bas -->
  @if (response.data.totalPages > 1) {
    <div class="mt-6">
      <app-paginate
        [totalPages]="response.data.totalPages"
        [number]="response.data.number"
        [first]="response.data.first"
        [last]="response.data.last"
        [pageSize]="response.data.size"
        (pageChange)="goToPage($event)"
        (pageSizeChange)="changePageSize($event)">
      </app-paginate>
    </div>
  }

}
