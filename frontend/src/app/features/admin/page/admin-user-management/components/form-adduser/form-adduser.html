<div class="mb-5 link-nxt">
  <a routerLink="/admin">Retour</a>
</div>

<div class="bg-nxt-white border border-nxt-gray rounded-xl p-6 max-w-2xl mx-auto">
  <h2 class="text-xl font-bold text-nxt-black mb-6">Ajouter un utilisateur</h2>

<!--  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4">-->
  <form class="space-y-4">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="form-label-nxt" for="firstname">Prénom</label>
        <input id="firstname" type="text"  class="input-nxt w-full" placeholder="Marie" />
        @if (userForm.get('firstname')?.invalid && userForm.get('firstname')?.touched) {
          <p class="form-error-nxt">Le prénom est requis</p>
        }
      </div>

      <div>
        <label class="form-label-nxt" for="lastname">Nom</label>
        <input id="lastname" type="text"  class="input-nxt w-full" placeholder="Dubois" />
        @if (userForm.get('lastname')?.invalid && userForm.get('lastname')?.touched) {
          <p class="form-error-nxt">Le nom est requis</p>
        }
      </div>
    </div>

    <div>
      <label class="form-label-nxt" for="email">Email</label>
      <input id="email" type="email"  class="input-nxt w-full" placeholder="marie.dubois@nexteam.fr" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="form-label-nxt" for="job">Métier</label>
        <select id="job" class="select-nxt w-full">
          <option value="" disabled selected>Sélectionner un métier</option>
<!--          @for (job of jobs(); track job.idJob) {-->
<!--            <option [value]="job.idJob">{{ job.title }}</option>-->
<!--          }-->
        </select>
      </div>

      <div>
        <label class="form-label-nxt" for="phone">Téléphone</label>
        <input id="phone" type="tel"  class="input-nxt w-full" placeholder="06 12 34 56 78" />
      </div>
    </div>

    <div class="flex justify-end items-center gap-3 pt-4 border-t border-nxt-gray">
      <a routerLink="/admin/gestion-utilisateurs" class="link-nxt">Annuler</a>
      <button type="submit" class="btn-nxt-blue">Créer l'utilisateur</button>
    </div>

  </form>
</div>
