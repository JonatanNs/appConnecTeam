<section class="min-h-screen bg-gray-100 p-8">
  <h1 class="text-2xl font-bold mb-10 text-center">Annuaire des employés</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-15">
      @for (user of users().data.content; track user.publicId) {
        <div class="w-full bg-white rounded-xl shadow-lg hover:shadow-2xl transition-shadow duration-300 p-6 relative">

          <!-- Profile Image -->
          <div class="flex justify-center -mt-16 mb-4">
            <img
              class="w-32 h-32 object-cover rounded-full border-4 border-white shadow-md hover:scale-105 transform transition-transform duration-300"
              src="https://avatars.githubusercontent.com/u/124576166?v=4" alt="Photo de profil">
          </div>

          <!-- Name and Title -->
          <article class="text-center mb-4">
            <h2 class="text-2xl font-semibold text-gray-800">{{ user.firstname }} {{ user.lastname }}</h2>
            <p class="text-gray-500">Creative Designer</p>
          </article>

          <!-- Description -->
          <p class="text-center text-gray-600 mb-6 px-4">Bio de la personne</p>

          <div class="flex justify-center space-x-4 mb-4">
            <!-- Linkedin -->
            <a href="#" class="text-gray-500 hover:text-blue-600 transition-colors duration-300">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.761 0 5-2.239 5-5v-14c0-2.761-2.239-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.268c-.966 0-1.75-.784-1.75-1.75s.784-1.75 1.75-1.75 1.75.784 1.75 1.75-.784 1.75-1.75 1.75zm13.5 11.268h-3v-5.604c0-1.338-.026-3.063-1.866-3.063-1.866 0-2.151 1.456-2.151 2.963v5.704h-3v-10h2.886v1.367h.041c.402-.76 1.386-1.562 2.852-1.562 3.052 0 3.613 2.007 3.613 4.615v5.58z" />
              </svg>
            </a>
          </div>

          <div class="card-actions w-full">
            <button class="btn btn-primary btn-sm flex-1">
              Message
            </button>
            <button class="btn btn-outline btn-primary btn-sm flex-1">
              Appeler
            </button>
          </div>
        </div>
      }
    </div>

    <app-paginate/>

</section>
