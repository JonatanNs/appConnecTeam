@if (conversation()) {
  <!-- En-tête de la conversation -->
  <header class="z-10 flex shrink-0 items-center justify-between border-b border-gray-200/80 bg-white px-3 py-2.5 shadow-2xs sm:px-4 md:px-6 md:py-3">

    <!-- Info Groupe & Navigation -->
    <div class="flex min-w-0 items-center gap-2.5 sm:gap-3.5">

      <!-- Bouton retour mobile -->
      <button
        routerLink="/messageries"
        class="-ml-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-gray-500 transition-all hover:bg-gray-100 hover:text-nxt-primary active:scale-95 lg:hidden"
        aria-label="Retour aux conversations"
        type="button">
        <fa-icon [icon]="faArrowLeft" class="text-base"></fa-icon>
      </button>

      <!-- Avatar avec badge -->
      <div class="relative shrink-0">
        <div class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-2xl border border-gray-200/80 bg-gradient-to-tr from-nxt-primary/10 to-blue-50 text-sm font-bold text-nxt-primary shadow-2xs sm:h-11 sm:w-11">
          <img class="h-full w-full object-cover"
               [src]="'https://ui-avatars.com/api/?background=003eff&color=fff&bold=true&name=' + (conversation()?.name ?? '?')"
               [alt]="conversation()?.name">
        </div>

        @if (isGroup()) {
          <span class="absolute -bottom-1 -right-1 flex h-5 min-w-[20px] items-center justify-center rounded-full border-2 border-white bg-nxt-primary px-1 text-[10px] font-bold text-white shadow-2xs">
            {{ conversation()?.users?.length }}
          </span>
        } @else {
          <span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>
        }
      </div>

      <!-- Titre & Sous-titre -->
      <div class="min-w-0 flex-1">
        <h3 class="truncate text-sm font-bold tracking-tight text-gray-900 sm:text-base">
          {{ conversation()?.name ?? 'Conversation' }}
        </h3>

        @if (isGroup()) {
          <p class="flex items-center gap-1.5 truncate text-xs font-medium text-gray-500">
            <span class="h-1.5 w-1.5 rounded-full bg-nxt-primary"></span>
            <span>{{ conversation()?.users?.length }} participants</span>
          </p>
        } @else {
          <p class="flex items-center gap-1.5 truncate text-xs font-medium text-emerald-600">
            <span>En ligne</span>
          </p>
        }
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- ACTIONS -->
    <!-- ====================================================== -->
    <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">

      <!-- Modifier (Desktop) -->
      <button onclick="edit_conversation_modal.showModal()"
              type="button"
              class="hidden items-center gap-2 rounded-xl border border-gray-200 bg-gray-50/80 px-3.5 py-2 text-xs font-semibold text-gray-700 transition-all hover:border-nxt-primary/30 hover:bg-nxt-primary/10 hover:text-nxt-primary active:scale-95 sm:flex">
        <fa-icon [icon]="faPenToSquare" class="text-sm text-nxt-primary"></fa-icon>
        <span>Modifier</span>
      </button>

      <!-- Participants (Desktop) -->
      <label for="conversation-drawer"
             class="hidden cursor-pointer items-center gap-2 rounded-xl border border-gray-200 bg-gray-50/80 px-3.5 py-2 text-xs font-semibold text-gray-700 transition-all hover:border-nxt-primary/30 hover:bg-nxt-primary/10 hover:text-nxt-primary active:scale-95 sm:flex">
        <fa-icon [icon]="faUsers" class="text-sm text-nxt-primary"></fa-icon>
        <span>Participants</span>
      </label>

      <!-- Bouton d'action rapide Mobile (Ouvre les participants) -->
      <label for="conversation-drawer"
             class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-xl border border-gray-200 bg-gray-50 text-gray-600 transition-all hover:bg-gray-100 hover:text-nxt-primary active:scale-95 sm:hidden">
        <fa-icon [icon]="faUsers" class="text-base"></fa-icon>
      </label>

    </div>
  </header>
}
