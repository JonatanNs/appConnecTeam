<div class="flex flex-col sm:flex-row gap-3 mb-6">

  <div class="relative hidden lg:block w-full">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
        <fa-icon [icon]="faMagnifyingGlass" class="text-sm"></fa-icon>
      </span>
    <input
      type="text"
      class="w-full pl-10"
      placeholder="Rechercher un nom, un email...">
  </div>


  <select class="select-nxt">
    <option value="all">Tous les statuts</option>
    <option value="active">Actif</option>
    <option value="inactive">Désactivé</option>
  </select>

  <select class="select-nxt">
    <option value="all">Tous les départements</option>
    <option value="active">IT</option>
    <option value="inactive">RH</option>
    <option value="inactive">Finance</option>
    <option value="inactive">Commercial</option>
  </select>
</div>
