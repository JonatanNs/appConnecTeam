<!-- Calendrier -->
<li>
  <a
    routerLink="/calendrier" routerLinkActive="bg-nxt-primary/10 text-nxt-primary font-semibold"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center px-3 py-2.5 rounded-xl text-xs font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors"
    [class.justify-center]="closed()"
    [class.px-0]="closed()"
    [class.tooltip]="closed()"
    [class.tooltip-right]="closed()"
    data-tip="Calendrier">
    <fa-icon [icon]="faCalendarDays" class="w-5 text-center shrink-0 text-gray-500"></fa-icon>
    @if (!closed()) {
      <span class="truncate ml-3 text-sm">Calendrier</span>
    }
  </a>
</li>
