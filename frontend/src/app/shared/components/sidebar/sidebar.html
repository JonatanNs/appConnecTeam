<div class="flex min-h-full flex-col items-start border-r border-gray-200 bg-nxt-white transition-all duration-200 is-drawer-close:w-14 is-drawer-open:w-72">

  <!-- Navigation -->
  <nav class="w-full grow overflow-y-auto p-2">
    <ul class="menu w-full space-y-1 p-0">

      <!-- Calendrier -->
      <li>
        <a
          routerLink="/calendrier"
          routerLinkActive="sidebar-link-nxt-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="sidebar-link-nxt flex items-center is-drawer-close:justify-center is-drawer-close:tooltip is-drawer-close:tooltip-right"
          data-tip="Calendrier">
          <fa-icon [icon]="faCalendarDays" class="w-5 text-center shrink-0"></fa-icon>
          <span class="is-drawer-close:hidden truncate">Calendrier</span>
        </a>
      </li>

      <!-- Contacts -->
      <li>
        <a
          routerLink="/contacts"
          routerLinkActive="sidebar-link-nxt-active"
          class="sidebar-link-nxt flex items-center is-drawer-close:justify-center is-drawer-close:tooltip is-drawer-close:tooltip-right"
          data-tip="Contacts">
          <fa-icon [icon]="faUsers" class="w-5 text-center shrink-0"></fa-icon>
          <span class="is-drawer-close:hidden truncate">Contacts</span>
        </a>
      </li>

      <!-- Documents -->
      <li>
        <a
          routerLink="/documents"
          routerLinkActive="sidebar-link-nxt-active"
          class="sidebar-link-nxt flex items-center is-drawer-close:justify-center is-drawer-close:tooltip is-drawer-close:tooltip-right"
          data-tip="Documents">
          <fa-icon [icon]="faFolderOpen" class="w-5 text-center shrink-0"></fa-icon>
          <span class="is-drawer-close:hidden truncate">Documents</span>
        </a>
      </li>

      <!-- Tâches -->
      <li>
        <a
          routerLink="/taches"
          routerLinkActive="sidebar-link-nxt-active"
          class="sidebar-link-nxt flex items-center is-drawer-close:justify-center is-drawer-close:tooltip is-drawer-close:tooltip-right"
          data-tip="Tâches">
          <fa-icon [icon]="faListCheck" class="w-5 text-center shrink-0"></fa-icon>
          <span class="is-drawer-close:hidden truncate">Tâches</span>
        </a>
      </li>

    </ul>
  </nav>
</div>
