<div
  class="flex h-full flex-col items-start bg-nxt-surface rounded-tr-xl border-t border-r border-gray-200/80 shadow-sm mt-1 transition-all duration-300 overflow-hidden"
  [class.w-16]="isClosed()"
  [class.w-72]="!isClosed()">

  <!-- Navigation (bloque le scroll horizontal) -->
  <nav
    class="w-full grow overflow-y-auto overflow-x-hidden transition-all duration-300"
    [class.p-2]="!isClosed()"
    [class.px-1.5]="isClosed()"
    [class.py-3]="isClosed()">

    <ul class="menu w-full space-y-1.5 py-3 whitespace-nowrap">

      <!-- Bouton Toggle -->
      <li>
        <button type="button"
                (click)="toggleSidebar()"
                [attr.aria-label]="isClosed() ? 'Agrandir le menu' : 'Réduire le menu'"
                class="flex items-center w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors cursor-pointer"
                [class.justify-center]="isClosed()"
                [class.px-0]="isClosed()"
                [class.tooltip]="isClosed()"
                [class.tooltip-right]="isClosed()"
                [attr.data-tip]="isClosed() ? 'Agrandir le menu' : 'Réduire le menu'">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2"
            fill="none"
            stroke="currentColor"
            class="w-5 h-5 shrink-0 transition-transform duration-300 text-gray-500"
            [class.rotate-180]="isClosed()">
            <path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path>
            <path d="M9 4v16"></path>
            <path d="M14 10l2 2l-2 2"></path>
          </svg>

          @if (!isClosed()) {
            <span class="truncate ml-3 text-lg">Réduire le menu</span>
          }
        </button>
      </li>

      <!-- Séparateur discret -->
      <div class="my-2 border-t border-gray-100 mx-2"></div>

      <app-list-sidebar [closed]="isClosed()"/>

    </ul>
  </nav>

  <div
    class="w-full border-t border-gray-100 transition-all duration-300"
    [class.p-3]="!isClosed()"
    [class.p-2]="isClosed()">
    <a
      routerLink="/aide" routerLinkActive="bg-nxt-primary/10 text-nxt-primary font-semibold"
      class="flex items-center px-4 py-3 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors"
      [class.justify-center]="isClosed()"
      [class.px-0]="isClosed()"
      [class.tooltip]="isClosed()"
      [class.tooltip-right]="isClosed()"
      data-tip="Aide et support">
      <fa-icon [icon]="faCircleQuestion" class="w-5 text-center shrink-0 text-gray-500 text-base"></fa-icon>
      @if (!isClosed()) {
        <span class="truncate ml-3.5 text-sm">Aide et support</span>
      }
    </a>
  </div>
</div>
